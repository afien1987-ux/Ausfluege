<script type="text/plain" id="app-source">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

if (!window.supabase) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;font-family:sans-serif;color:#8a2e2e;background:#fbeaea;min-height:100vh;">' +
    '<h3>Supabase-Bibliothek nicht geladen</h3>' +

  throw new Error("supabase-js nicht geladen");
}

const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const TABLE = "pool_data";

function notifyError(message) {
  window.dispatchEvent(new CustomEvent("app-toast", { detail: { message } }));
}

async function dbGet(roomCode, key) {
  const { data, error } = await sb.from(TABLE).select("data_value").eq("room_code", roomCode).eq("data_key", key).maybeSingle();
  if (error) { console.error(error); return null; }
  return data ? data.data_value : null;
}
async function dbSet(roomCode, key, value) {
  const { error } = await sb.from(TABLE).upsert(
    { room_code: roomCode, data_key: key, data_value: value, updated_at: new Date().toISOString() },
    { onConflict: "room_code,data_key" }
  );
  if (error) {
    console.error(error);
    notifyError("Speichern fehlgeschlagen. Bitte Internetverbindung prüfen und erneut versuchen.");
    return false;
  }
  return true;
}
async function dbListKeys(roomCode, prefix) {
  const { data, error } = await sb.from(TABLE).select("data_key").eq("room_code", roomCode).like("data_key", `${prefix}%`);
  if (error) { console.error(error); return []; }
  return data.map((d) => d.data_key);
}
async function fetchRoundVotes(roomCode, roundId) {
  const prefix = `votes:${roundId}:`;
  const keys = await dbListKeys(roomCode, prefix);
  const votesObj = {};
  for (const k of keys) {
    const v = await dbGet(roomCode, k);
    if (v) votesObj[k.slice(prefix.length)] = v;
  }
  return votesObj;
}
async function fetchRoundDayVotes(roomCode, roundId) {
  const prefix = `dayvotes:${roundId}:`;
  const keys = await dbListKeys(roomCode, prefix);
  const obj = {};
  for (const k of keys) {
    const v = await dbGet(roomCode, k);
    if (v) obj[k.slice(prefix.length)] = v;
  }
  return obj;
}
async function fetchTerminDayVotes(roomCode, terminId) {
  const prefix = `termintage:${terminId}:`;
  const keys = await dbListKeys(roomCode, prefix);
  const obj = {};
  for (const k of keys) {
    const v = await dbGet(roomCode, k);
    if (v) obj[k.slice(prefix.length)] = v;
  }
  return obj;
}

const uid = () => Math.random().toString(36).slice(2, 10);

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function plusDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function formatDate(dateStr) {
  if (!dateStr) return "";
  try {
    const [y, m, d] = dateStr.split("-");
    return `${d}.${m}.${y}`;
  } catch (e) {
    return dateStr;
  }
}
function roundStatus(round) {
  const t = todayStr();
  if (t < round.startDate) return "geplant";
  if (t > round.endDate) return "beendet";
  return "aktiv";
}
const STATUS_LABEL = { geplant: "Geplant", aktiv: "Aktiv", beendet: "Beendet" };
const STATUS_COLOR = { geplant: "#8A8A7A", aktiv: "#3F6B4A", beendet: "#4C7A94" };

function ToastHost() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const handler = (e) => {
      const id = Math.random().toString(36).slice(2);
      setToasts((prev) => [...prev, { id, message: e.detail.message }]);
      setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4000);
    };
    window.addEventListener("app-toast", handler);
    return () => window.removeEventListener("app-toast", handler);
  }, []);
  if (toasts.length === 0) return null;
  return (
    <div style={S.toastWrap}>
      {toasts.map((t) => <div key={t.id} style={S.toast}>{t.message}</div>)}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error) {
    console.error(error);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={S.errorScreen}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>😕</div>
          <div style={{ fontWeight: 700, marginBottom: 6 }}>Etwas ist schiefgelaufen</div>
          <p style={S.hintSmall}>Die App hatte einen unerwarteten Fehler. Ein Neuladen hilft meistens.</p>
          <button style={S.primaryBtn} onClick={() => window.location.reload()}>Seite neu laden</button>
        </div>
      );
    }
    return this.props.children;
  }
}

function ImageWithFallback({ src, alt, style }) {
  const [failed, setFailed] = useState(false);
  if (!src || failed) {
    return <div style={{ ...style, background: "#E4E1D4", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>🖼️</div>;
  }
  return <img src={src} alt={alt} style={style} onError={() => setFailed(true)} />;
}

function isValidUrl(str) {
  if (!str) return true;
  return /^https?:\/\/.+/i.test(str.trim());
}

// --- Einheitliche Zurück-Navigation (Android/Browser-Zurück-Taste) ---
// Ein gemeinsamer Stapel sorgt dafür, dass ein Zurück-Druck IMMER genau eine
// Ebene schließt (nie mehrere gleichzeitig), egal ob Tab-Wechsel, Detailseite,
// Bearbeiten-Modus oder Menü. Ist der Stapel leer, fragt die App nach, bevor
// sie wirklich geschlossen wird.
const navStack = [];
let bypassExitConfirm = false;

function pushNav(onBack) {
  const id = Math.random().toString(36).slice(2);
  navStack.push({ id, onBack });
  window.history.pushState({ navId: id }, "");
  return id;
}
function popNavProgrammatic(id) {
  const topIdx = navStack.length - 1;
  if (topIdx >= 0 && navStack[topIdx].id === id) {
    navStack.pop();
    window.history.back();
  } else {
    const idx = navStack.findIndex((e) => e.id === id);
    if (idx !== -1) navStack.splice(idx, 1);
  }
}

window.history.pushState({ guard: true }, "");
window.addEventListener("popstate", () => {
  if (navStack.length > 0) {
    const top = navStack.pop();
    top.onBack();
    return;
  }
  if (bypassExitConfirm) {
    bypassExitConfirm = false;
    return;
  }
  window.history.pushState({ guard: true }, "");
  const reallyClose = window.confirm("Möchtest du die App wirklich schließen?");
  if (reallyClose) {
    bypassExitConfirm = true;
    window.history.back();
  }
});

function useBackClose(active, onBack) {
  const idRef = useRef(null);
  const onBackRef = useRef(onBack);
  onBackRef.current = onBack;

  useEffect(() => {
    if (active && idRef.current === null) {
      idRef.current = pushNav(() => onBackRef.current());
    } else if (!active && idRef.current !== null) {
      popNavProgrammatic(idRef.current);
      idRef.current = null;
    }
  }, [active]);
}

function useTabNav(initialTab) {
  const [tab, setTabState] = useState(initialTab);
  const goTo = useCallback((newTab) => {
    setTabState((current) => {
      if (current === newTab) return current;
      pushNav(() => setTabState(current));
      return newTab;
    });
  }, []);
  return [tab, goTo];
}

function App() {
  const [loadingProfile, setLoadingProfile] = useState(true);
  const [roomCode, setRoomCode] = useState("");
  const [name, setName] = useState("");
  const [joined, setJoined] = useState(false);
  const [tab, setTab] = useTabNav("ziele");
  const [menuOpen, setMenuOpen] = useState(false);
  useBackClose(menuOpen, () => setMenuOpen(false));
  const [destinations, setDestinations] = useState([]);
  const [members, setMembers] = useState([]);
  const [rounds, setRounds] = useState([]);
  const [termine, setTermine] = useState([]);
  const [ratingsByDest, setRatingsByDest] = useState({});
  const [busy, setBusy] = useState(false);
  const [recentProfiles, setRecentProfiles] = useState([]);

  useEffect(() => {
    try {
      const recentRaw = localStorage.getItem("ausflug_recent");
      if (recentRaw) setRecentProfiles(JSON.parse(recentRaw) || []);
    } catch (e) {}
    try {
      const raw = localStorage.getItem("ausflug_profile");
      if (raw) {
        const p = JSON.parse(raw);
        if (p.roomCode && p.name) {
          setRoomCode(p.roomCode);
          setName(p.name);
          setJoined(true);
        }
      }
    } catch (e) {}
    setLoadingProfile(false);
  }, []);

  const rememberProfile = (rc, n) => {
    localStorage.setItem("ausflug_profile", JSON.stringify({ roomCode: rc, name: n }));
    setRecentProfiles((prev) => {
      const filtered = prev.filter((p) => !(p.roomCode === rc && p.name === n));
      const next = [{ roomCode: rc, name: n }, ...filtered].slice(0, 6);
      localStorage.setItem("ausflug_recent", JSON.stringify(next));
      return next;
    });
  };

  const destKey = "destinations";
  const membersKey = "members";
  const roundsKey = "rounds";
  const ratingsPrefix = "ratings:";
  const termineKey = "termine";

  const ensureMembership = useCallback(async (roomCode, name) => {
    const raw = await dbGet(roomCode, membersKey);
    const list = raw || [];
    if (!list.includes(name)) {
      const next = [...list, name];
      await dbSet(roomCode, membersKey, next);
      return next;
    }
    return list;
  }, []);

  const refresh = useCallback(async () => {
    if (!roomCode) return;
    setBusy(true);
    const destRaw = await dbGet(roomCode, destKey);
    setDestinations(destRaw || []);
    const membersRaw = await dbGet(roomCode, membersKey);
    setMembers(membersRaw || []);
    const roundsRaw = await dbGet(roomCode, roundsKey);
    setRounds(roundsRaw || []);
    const ratingKeys = await dbListKeys(roomCode, ratingsPrefix);
    const ratingsObj = {};
    for (const k of ratingKeys) {
      const v = await dbGet(roomCode, k);
      if (v) ratingsObj[k.slice(ratingsPrefix.length)] = v;
    }
    setRatingsByDest(ratingsObj);
    const termineRaw = await dbGet(roomCode, termineKey);
    setTermine(termineRaw || []);
    setBusy(false);
  }, [roomCode]);

  useEffect(() => {
    if (!joined) return;
    (async () => {
      await ensureMembership(roomCode, name);
      await refresh();
    })();
    const interval = setInterval(refresh, REFRESH_MS);
    return () => clearInterval(interval);
  }, [joined, refresh]);

  const handleJoin = () => {
    if (!roomCode.trim() || !name.trim()) return;
    const rc = roomCode.trim().toUpperCase();
    const n = name.trim();
    setRoomCode(rc);
    setName(n);
    rememberProfile(rc, n);
    setJoined(true);
  };
  const quickJoin = (profile) => {
    setRoomCode(profile.roomCode);
    setName(profile.name);
    rememberProfile(profile.roomCode, profile.name);
    setJoined(true);
  };
  const switchPool = () => setJoined(false);

  const saveDestinations = async (next) => {
    setDestinations(next);
    await dbSet(roomCode, destKey, next);
  };
  const addDestination = async (dest) => {
    const next = [...destinations, { ...dest, id: uid(), archived: false, archivedAt: null, archivedPoints: null, proposedBy: name }];
    await saveDestinations(next);
  };
  const removeDestination = async (id) => {
    const next = destinations.filter((d) => d.id !== id);
    await saveDestinations(next);
  };
  const editDestination = async (id, updates) => {
    const next = destinations.map((d) => (d.id === id ? { ...d, ...updates } : d));
    await saveDestinations(next);
  };

  const saveRating = async (destId, updates) => {
    const current = ratingsByDest[destId] || {};
    const mine = current[name] || {};
    const nextEntry = { ...mine, ...updates };
    const nextForDest = { ...current, [name]: nextEntry };
    setRatingsByDest((prev) => ({ ...prev, [destId]: nextForDest }));
    await dbSet(roomCode, `${ratingsPrefix}${destId}`, nextForDest);
  };

  const activeDestinations = destinations.filter((d) => !d.archived);
  const archivedDestinations = destinations.filter((d) => d.archived);

  const archiveDestination = async (id) => {
    const candidateRounds = rounds
      .filter((r) => r.destinationIds.includes(id) && roundStatus(r) === "beendet")
      .sort((a, b) => (a.endDate < b.endDate ? 1 : -1));
    let pts = null;
    if (candidateRounds.length > 0) {
      const votes = await fetchRoundVotes(roomCode, candidateRounds[0].id);
      let sum = 0;
      Object.values(votes).forEach((v) => { if (v && v[id] !== undefined) sum += Number(v[id]) || 0; });
      pts = sum;
    }
    const next = destinations.map((d) =>
      d.id === id ? { ...d, archived: true, archivedAt: new Date().toISOString(), archivedPoints: pts } : d
    );
    await saveDestinations(next);
  };
  const reactivateDestination = async (id) => {
    const next = destinations.map((d) =>
      d.id === id ? { ...d, archived: false, archivedAt: null, archivedPoints: null } : d
    );
    await saveDestinations(next);
  };

  const saveRounds = async (next) => {
    setRounds(next);
    await dbSet(roomCode, roundsKey, next);
  };
  const createRound = async (roundData) => {
    const next = [...rounds, { ...roundData, id: uid(), createdBy: name, createdAt: new Date().toISOString() }];
    await saveRounds(next);
  };
  const deleteRound = async (id) => {
    const next = rounds.filter((r) => r.id !== id);
    await saveRounds(next);
  };

  const saveTermine = async (next) => {
    setTermine(next);
    await dbSet(roomCode, termineKey, next);
  };
  const createTermin = async (data) => {
    const next = [...termine, { ...data, id: uid(), createdBy: name, createdAt: new Date().toISOString() }];
    await saveTermine(next);
  };
  const deleteTermin = async (id) => {
    const next = termine.filter((t) => t.id !== id);
    await saveTermine(next);
  };

  if (loadingProfile) return <div style={S.loadingScreen}>Lädt …</div>;
  if (!joined) return <JoinScreen roomCode={roomCode} setRoomCode={setRoomCode} name={name} setName={setName} onJoin={handleJoin} recentProfiles={recentProfiles} onQuickJoin={quickJoin} />;

  return (
    <div style={S.app}>
      <ToastHost />
      <Header roomCode={roomCode} name={name} onRefresh={refresh} onSwitchPool={switchPool} onMenu={() => setMenuOpen(true)} busy={busy} />
      {menuOpen ? (
        <MenuOverlay onClose={() => setMenuOpen(false)} />
      ) : (
        <>
          <div style={S.content}>
            {tab === "ziele" && (
              <ZieleTab destinations={activeDestinations} onAdd={addDestination} onRemove={removeDestination} onArchive={archiveDestination} onEdit={editDestination} ratingsByDest={ratingsByDest} onRate={saveRating} name={name} />
            )}
            {tab === "runden" && (
              <RundenTab
                rounds={rounds}
                destinations={destinations}
                activeDestinations={activeDestinations}
                members={members}
                roomCode={roomCode}
                name={name}
                onCreateRound={createRound}
                onDeleteRound={deleteRound}
              />
            )}
            {tab === "termine" && (
              <TermineTab
                termine={termine}
                activeDestinations={activeDestinations}
                members={members}
                roomCode={roomCode}
                name={name}
                onCreateTermin={createTermin}
                onDeleteTermin={deleteTermin}
              />
            )}
            {tab === "archiv" && (
              <ArchivTab destinations={archivedDestinations} onReactivate={reactivateDestination} />
            )}
          </div>
          <TabBar tab={tab} setTab={setTab} />
        </>
      )}
    </div>
  );
}

        <div style={{ ...S.joinCard, maxHeight: "85vh", overflowY: "auto" }}>

          <HilfeTab />
        </div>
      </div>
    );
  }

  return (
    <div style={S.joinWrap}>
      <div style={S.joinCard}>
        <div style={S.joinIcon}>🧭</div>
        <h1 style={S.joinTitle}>Ausflugs-Pool</h1>
        <p style={S.joinSub}>Sammelt Ziele, vergebt Punkte, findet eure gemeinsame Prioritätenliste.</p>
        <button style={S.helpLink} onClick={() => setShowHelp(true)}>❓ Wie funktioniert die App?</button>

        {recentProfiles && recentProfiles.length > 0 && (
          <div style={{ marginBottom: 18 }}>
            <label style={S.label}>Zuletzt genutzt</label>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {recentProfiles.map((p, i) => (
                <button key={i} style={S.recentBtn} onClick={() => onQuickJoin(p)}>
                  <span style={{ fontWeight: 700 }}>{p.roomCode}</span>
                  <span style={{ color: "#8A8A7A" }}> · {p.name}</span>
                  <span style={{ marginLeft: "auto" }}>→</span>
                </button>
              ))}
            </div>
            <div style={S.orDivider}>oder neu / anders beitreten</div>
          </div>
        )}

        <label style={S.label}>Familien-Code</label>
        <input style={S.input} placeholder="z. B. MEYER26" value={roomCode} onChange={(e) => setRoomCode(e.target.value.toUpperCase())} maxLength={20} />
        <p style={S.hint}>Jeder in der Familie gibt denselben Code ein – so landen alle Stimmen im selben Pool.</p>
        <label style={S.label}>Dein Name</label>
        <input style={S.input} placeholder="z. B. Papa, Lina, Oma..." value={name} onChange={(e) => setName(e.target.value)} maxLength={24} />
        <button style={{ ...S.primaryBtn, opacity: roomCode.trim() && name.trim() ? 1 : 0.45 }} disabled={!(roomCode.trim() && name.trim())} onClick={onJoin}>
          Beitreten →
        </button>
      </div>
    </div>
  );
}

      <div>
        <div style={S.headerEyebrow}>FAMILIEN-CODE</div>

  try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY) || "{}"); } catch (e) { return {}; }
}
function setGeocodeCacheEntry(address, coords) {
  try {
    const cache = getGeocodeCache();
    cache[address] = coords;
    localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache));
  } catch (e) {}
}
async function geocodeAddress(address) {
  const cache = getGeocodeCache();
  if (cache[address]) return cache[address];
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`);
  const data = await res.json();
  if (!data || data.length === 0) return null;
  const coords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
  setGeocodeCacheEntry(address, coords);
  return coords;
}

function ZieleTab({ destinations, onAdd, onRemove, onArchive, onEdit, ratingsByDest, onRate, name }) {
  const [showForm, setShowForm] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [userPos, setUserPos] = useState(null);
  const [geoStatus, setGeoStatus] = useState("idle"); // idle | granted | denied
  const [distances, setDistances] = useState({});

  useBackClose(showForm, () => setShowForm(false));
  useBackClose(!!openId, () => setOpenId(null));

  useEffect(() => {
    if (!navigator.geolocation) { setGeoStatus("denied"); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setUserPos({ lat: pos.coords.latitude, lon: pos.coords.longitude }); setGeoStatus("granted"); },
      () => setGeoStatus("denied"),
      { timeout: 10000 }
    );
  }, []);

  useEffect(() => {
    if (!userPos) return;
    let cancelled = false;
    (async () => {
      for (const d of destinations) {
        if (!d.location || distances[d.id] !== undefined) continue;
        const coords = await geocodeAddress(d.location);
        if (cancelled) return;
        if (coords) {
          const km = haversineKm(userPos.lat, userPos.lon, coords.lat, coords.lon);
          setDistances((prev) => ({ ...prev, [d.id]: km }));
        } else {
          setDistances((prev) => ({ ...prev, [d.id]: null }));
        }
        await new Promise((r) => setTimeout(r, 1100));
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, [userPos, destinations.map((d) => d.id + ":" + (d.location || "")).join("|")]);

  const open = destinations.find((d) => d.id === openId);
  if (open) {
    return (
      <DestDetail
        d={open}
        ratings={ratingsByDest[open.id] || {}}
        onRate={(updates) => onRate(open.id, updates)}
        onArchive={onArchive}
        onRemove={onRemove}
        onEdit={onEdit}
        onBack={() => setOpenId(null)}
        name={name}
        distanceKm={distances[open.id]}
        geoStatus={geoStatus}
      />
    );
  }

  return (
    <div style={S.tabContent}>
      {!showForm && <button style={S.addBtn} onClick={() => setShowForm(true)}>+ Neues Ziel vorschlagen</button>}
      {showForm && <AddForm onCancel={() => setShowForm(false)} onSubmit={(d) => { onAdd(d); setShowForm(false); }} />}
      {destinations.length === 0 && !showForm && (
        <div style={S.emptyState}><span style={{ fontSize: 26 }}>📍</span><p>Noch keine Ziele im Pool. Schlag das erste vor!</p></div>
      )}
      {destinations.map((d) => {
        const cat = CATEGORY.find((c) => c.id === d.category);
        const destRatings = ratingsByDest[d.id] || {};
        const entries = Object.values(destRatings);
        const avg = entries.length ? (entries.reduce((s, r) => s + (r.stars || 0), 0) / entries.length).toFixed(1) : null;
        const km = distances[d.id];
        return (
          <button key={d.id} style={S.card} onClick={() => setOpenId(d.id)}>
            <ImageWithFallback src={d.photoUrl} alt={d.name} style={S.cardImg} />
            <div style={S.cardBody}>
              <div style={S.cardTitle}>{d.name}</div>
              <div style={S.tagRow}>
                {cat && <span style={{ ...S.tag, background: cat.color + "22", color: cat.color }}>{cat.emoji} {cat.label}</span>}
                {d.location && km !== undefined && km !== null && <span style={S.tag}>📍 {km.toFixed(1)} km</span>}
                {d.location && km === undefined && <span style={S.tag}>📍 …</span>}
                {avg && <span style={S.tag}>★ {avg}</span>}
              </div>
              <div style={S.proposedBy}>Vorschlag von {d.proposedBy}</div>
            </div>
          </button>
        );
      })}
    </div>
  );
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function LocationAutocomplete({ value, onChange }) {
  const [suggestions, setSuggestions] = useState([]);
  const [loading, setLoading] = useState(false);
  const [showList, setShowList] = useState(false);
  const timeoutRef = useRef(null);

  useEffect(() => {
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    if (!value || value.trim().length < 3) { setSuggestions([]); return; }
    timeoutRef.current = setTimeout(async () => {
      setLoading(true);
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(value)}&limit=5`);
        const data = await res.json();
        setSuggestions(data || []);
      } catch (e) {
        setSuggestions([]);
      }
      setLoading(false);
    }, 500);
    return () => clearTimeout(timeoutRef.current);
  }, [value]);

  return (
    <div style={{ position: "relative" }}>
      <input
        style={S.input}
        placeholder="z. B. Steinstraße 14, Konstanz"
        value={value}
        onChange={(e) => { onChange(e.target.value); setShowList(true); }}
        onFocus={() => setShowList(true)}
        onBlur={() => setTimeout(() => setShowList(false), 150)}
      />
      {loading && <div style={S.hintSmall}>Suche Adressen…</div>}
      {showList && suggestions.length > 0 && (
        <div style={S.suggestBox}>
          {suggestions.map((s, i) => (
            <button
              key={i}
              style={S.suggestItem}
              onMouseDown={() => { onChange(s.display_name); setSuggestions([]); setShowList(false); }}
            >
              {s.display_name}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

    if (candidateDays.length > 0) {
      const dv = await fetchRoundDayVotes(roomCode, round.id);
      setDayVotes(dv);
      setMyDays(dv[name] || []);
    }
    setLoadingVotes(false);
  }, [roomCode, round.id, name, status]);

  useEffect(() => { loadVotes(); }, [loadVotes]);

  const saveMyVotes = async (draft) => {
    setMyDraft(draft);
    await dbSet(roomCode, `votes:${round.id}:${name}`, draft);
    setVotes((prev) => ({ ...prev, [name]: draft }));
  };

  const saveMyDays = async (days) => {
    setMyDays(days);
    await dbSet(roomCode, `dayvotes:${round.id}:${name}`, days);
    setDayVotes((prev) => ({ ...prev, [name]: days }));
  };
  const toggleDay = (day) => {
    const next = myDays.includes(day) ? myDays.filter((d) => d !== day) : [...myDays, day];
    saveMyDays(next);
  };

  const ranking = useMemo(() => {
    const sums = {};
    roundDests.forEach((d) => (sums[d.id] = 0));
    Object.values(votes).forEach((v) => {
      Object.entries(v || {}).forEach(([destId, pts]) => {
        if (sums[destId] !== undefined) sums[destId] += Number(pts) || 0;
      });
    });
    const arr = roundDests.map((d) => ({ ...d, points: sums[d.id] || 0 }));
    arr.sort((a, b) => b.points - a.points);
    let rank = 0, lastPoints = null;
    return arr.map((d, i) => {
      if (d.points !== lastPoints) { rank = i + 1; lastPoints = d.points; }
      return { ...d, rank };
    });
  }, [roundDests, votes]);

  const dayCounts = useMemo(() => {
    const arr = candidateDays.map((day) => ({
      day,
      count: Object.values(dayVotes).filter((list) => (list || []).includes(day)).length,
    }));
    arr.sort((a, b) => b.count - a.count);
    return arr;
  }, [candidateDays, dayVotes]);
  const maxDayCount = Math.max(...dayCounts.map((d) => d.count), 1);

  const completedVoters = members.filter((m) => votes[m] && Object.keys(votes[m]).length === roundDests.length);
  const pendingVoters = members.filter((m) => !completedVoters.includes(m));

  return (
    <div style={S.tabContent}>
      <button style={S.backBtn} onClick={onBack}>← Zurück zu allen Runden</button>

      <div style={S.roundHeaderCard}>
        <div style={S.roundCardTop}>
          <span style={S.roundAliasBig}>{round.alias}</span>
          <span style={{ ...S.statusBadge, background: STATUS_COLOR[status] + "22", color: STATUS_COLOR[status] }}>{STATUS_LABEL[status]}</span>
        </div>
        <div style={S.roundDates}>{formatDate(round.startDate)} – {formatDate(round.endDate)}</div>
      </div>

      {status === "geplant" && (
        <>
          <div style={S.voteHint}>Diese Runde startet am {formatDate(round.startDate)}. Bis dahin ist noch keine Abstimmung möglich.</div>
          <div style={S.sectionLabel}>Vorschau: {roundDests.length} Ziele</div>
          {roundDests.map((d) => <div key={d.id} style={S.previewRow}>{d.name}</div>)}
          {candidateDays.length > 0 && (
            <>
              <div style={S.sectionLabel}>Terminvorschläge</div>
              {candidateDays.map((day) => <div key={day} style={S.previewRow}>{formatDate(day)}</div>)}
            </>
          )}
          <button style={S.dangerBtn} onClick={() => { if (window.confirm(`Runde "${round.alias}" wirklich löschen?`)) onDelete(); }}>Runde löschen</button>
        </>
      )}

      {status !== "geplant" && loadingVotes && <div style={S.voteHint}>Lädt Stimmen …</div>}

      {status === "aktiv" && !loadingVotes && (
        <>
          <div style={S.sectionLabel}>Ziele bewerten</div>
          <VotingBlock destinations={roundDests} myVotes={myDraft} onSave={saveMyVotes} />

          {candidateDays.length > 0 && (
            <>
              <div style={S.sectionLabel}>An welchem Tag könnt ihr?</div>
              <div style={S.voteHint}>Wähl alle Tage aus, an denen es bei dir passt – jederzeit änderbar.</div>
              {candidateDays.map((day) => (
                <label key={day} style={S.checkRow}>
                  <input type="checkbox" checked={myDays.includes(day)} onChange={() => toggleDay(day)} />
                  <span>{formatDate(day)}</span>
                </label>
              ))}
              <div style={S.sectionLabel}>Terminstand</div>
              {dayCounts.map((dc, i) => (
                <div key={dc.day} style={S.rankRow}>
                  <div style={S.rankBadge}>{i + 1}</div>
                  <div style={{ flex: 1 }}>
                    <div style={S.rankName}>{formatDate(dc.day)}</div>
                    <div style={S.rankBarTrack}><div style={{ ...S.rankBarFill, width: `${Math.max(6, (dc.count / maxDayCount) * 100)}%` }} /></div>
                  </div>
                  <div style={S.rankPoints}>{dc.count}</div>
                </div>
              ))}
            </>
          )}

          <div style={S.sectionLabel}>Zwischenstand Ziele (live)</div>
          {pendingVoters.length > 0 && <div style={S.pendingBanner}>Noch offen: {pendingVoters.join(", ")}</div>}
          <RankingList ranking={ranking} />
        </>
      )}

      {status === "beendet" && !loadingVotes && (
        <>
          <div style={S.sectionLabel}>Ergebnis</div>
          <RankingList ranking={ranking} />
          {candidateDays.length > 0 && (
            <>
              <div style={S.sectionLabel}>Gewählter Termin</div>
              {dayCounts.map((dc, i) => (
                <div key={dc.day} style={S.rankRow}>
                  <div style={S.rankBadge}>{i + 1}</div>
                  <div style={{ flex: 1 }}><div style={S.rankName}>{formatDate(dc.day)}</div></div>
                  <div style={S.rankPoints}>{dc.count}</div>
                </div>
              ))}
            </>
          )}
        </>
      )}
    </div>
  );
}

function VotingBlock({ destinations, myVotes, onSave }) {
  const n = destinations.length;
  const [draft, setDraft] = useState({});
  useEffect(() => { setDraft(myVotes || {}); }, [myVotes, destinations.length]);

  const usedPoints = new Set(Object.values(draft).filter((v) => v !== undefined && v !== ""));
  const allNumbers = Array.from({ length: n }, (_, i) => i + 1);
  const completed = Object.keys(draft).length === n && new Set(Object.values(draft)).size === n;

  const setPoint = (destId, val) => {
    const next = { ...draft };
    if (val === "") delete next[destId]; else next[destId] = Number(val);
    setDraft(next);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={S.voteHint}>Vergib Punkte von 1 bis {n} — dein wichtigstes Ziel bekommt {n}, jede Zahl nur einmal.</div>
      {destinations.map((d) => {
        const current = draft[d.id] ?? "";
        return (
          <div key={d.id} style={S.voteRow}>
            <div style={S.voteName}>{d.name}</div>
            <select style={{ ...S.select, borderColor: current ? "#3F6B4A" : "#D8D5C6" }} value={current} onChange={(e) => setPoint(d.id, e.target.value)}>
              <option value="">–</option>
              {allNumbers.map((num) => <option key={num} value={num} disabled={usedPoints.has(num) && current !== num}>{num}</option>)}
            </select>
          </div>
        );
      })}
      <button style={{ ...S.primaryBtn, opacity: completed ? 1 : 0.45 }} disabled={!completed} onClick={() => onSave(draft)}>
        {completed ? "Bewertung speichern" : `Noch ${n - Object.keys(draft).length} Ziel(e) offen`}
      </button>
    </div>
  );
}

function RankingList({ ranking }) {
  if (ranking.length === 0) return <div style={S.emptyState}><p>Noch keine Stimmen abgegeben.</p></div>;
  const maxPoints = Math.max(...ranking.map((r) => r.points), 1);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {ranking.map((d) => (
        <div key={d.id} style={S.rankRow}>
          <div style={S.rankBadge}>{d.rank}</div>
          <div style={{ flex: 1 }}>
            <div style={S.rankName}>{d.name}</div>
            <div style={S.rankBarTrack}><div style={{ ...S.rankBarFill, width: `${Math.max(6, (d.points / maxPoints) * 100)}%` }} /></div>
          </div>
          <div style={S.rankPoints}>{d.points}</div>
        </div>
      ))}
    </div>
  );
}

function TermineTab({ termine, activeDestinations, members, roomCode, name, onCreateTermin, onDeleteTermin }) {
  const [mode, setMode] = useState("list"); // list | create | detail
  const [selectedId, setSelectedId] = useState(null);
  useBackClose(mode !== "list", () => { setMode("list"); setSelectedId(null); });

  if (mode === "create") {
    return (
      <TerminCreateForm
        activeDestinations={activeDestinations}
        onCancel={() => setMode("list")}
        onSubmit={(data) => { onCreateTermin(data); setMode("list"); }}
      />
    );
  }

  if (mode === "detail" && selectedId) {
    const termin = termine.find((t) => t.id === selectedId);
    if (!termin) { setMode("list"); return null; }
    const dest = activeDestinations.find((d) => d.id === termin.destinationId) || { name: "(gelöschtes Ziel)" };
    return (
      <TerminDetail
        termin={termin}
        destination={dest}
        members={members}
        roomCode={roomCode}
        name={name}
        onBack={() => { setMode("list"); setSelectedId(null); }}
        onDelete={() => { onDeleteTermin(termin.id); setMode("list"); }}
      />
    );
  }

  const sorted = [...termine].sort((a, b) => (a.endDate < b.endDate ? 1 : -1));

  return (
    <div style={S.tabContent}>
      <button style={S.addBtn} onClick={() => setMode("create")}>+ Neue Terminfindung</button>
      {sorted.length === 0 && (
        <div style={S.emptyState}><span style={{ fontSize: 26 }}>📅</span><p>Noch keine Terminfindung angelegt. Legt ein Ziel fest und findet gemeinsam den passenden Tag.</p></div>
      )}
      {sorted.map((t) => {
        const dest = activeDestinations.find((d) => d.id === t.destinationId);
        const status = todayStr() > t.endDate ? "beendet" : "aktiv";
        return (
          <button key={t.id} style={S.roundCard} onClick={() => { setSelectedId(t.id); setMode("detail"); }}>
            <div style={S.roundCardTop}>
              <span style={S.roundAlias}>{dest ? dest.name : "(gelöschtes Ziel)"}</span>
              <span style={{ ...S.statusBadge, background: STATUS_COLOR[status] + "22", color: STATUS_COLOR[status] }}>{STATUS_LABEL[status]}</span>
            </div>
            <div style={S.roundDates}>Offen bis {formatDate(t.endDate)} · {t.candidateDays.length} Terminvorschläge</div>
          </button>
        );
      })}
    </div>
  );
}

function TerminCreateForm({ activeDestinations, onCancel, onSubmit }) {
  const [destinationId, setDestinationId] = useState(activeDestinations[0]?.id || "");
  const [endDate, setEndDate] = useState(plusDays(todayStr(), 7));
  const [candidateDays, setCandidateDays] = useState([]);

  const addDay = () => setCandidateDays([...candidateDays, endDate]);
  const updateDay = (i, val) => setCandidateDays(candidateDays.map((d, idx) => (idx === i ? val : d)));
  const removeDay = (i) => setCandidateDays(candidateDays.filter((_, idx) => idx !== i));

  const valid = destinationId && endDate && candidateDays.length >= 2;

  if (activeDestinations.length === 0) {
    return (
      <div style={S.tabContent}>
        <div style={S.emptyState}><p>Erst im Tab "Ziele" ein Ziel anlegen, bevor ihr eine Terminfindung startet.</p></div>
        <button style={S.secondaryBtn} onClick={onCancel}>Zurück</button>
      </div>
    );
  }

  return (
    <div style={S.formCard}>
      <label style={S.label}>Ziel</label>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
        {activeDestinations.map((d) => (
          <label key={d.id} style={S.checkRow}>
            <input type="radio" name="terminDest" checked={destinationId === d.id} onChange={() => setDestinationId(d.id)} />
            <span>{d.name}</span>
          </label>
        ))}
      </div>

      <label style={S.label}>Offen bis</label>
      <input style={S.input} type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} />

      <label style={S.label}>Terminvorschläge ({candidateDays.length})</label>
      <p style={S.hint}>Mindestens 2 Tage, an denen abgestimmt werden soll, wer Zeit hat.</p>
      {candidateDays.map((d, i) => (
        <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
          <input style={{ ...S.input, marginBottom: 0 }} type="date" value={d} onChange={(e) => updateDay(i, e.target.value)} />
          <button style={S.secondaryBtn} onClick={() => removeDay(i)}>✕</button>
        </div>
      ))}
      <button style={S.secondaryBtn} onClick={addDay}>+ Tag hinzufügen</button>

      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        <button style={S.secondaryBtn} onClick={onCancel}>Abbrechen</button>
        <button
          style={{ ...S.primaryBtn, flex: 1, opacity: valid ? 1 : 0.45 }}
          disabled={!valid}
          onClick={() => onSubmit({ destinationId, endDate, candidateDays })}
        >
          Terminfindung starten
        </button>
      </div>
    </div>
  );
}

function TerminDetail({ termin, destination, members, roomCode, name, onBack, onDelete }) {
  const status = todayStr() > termin.endDate ? "beendet" : "aktiv";
  const [dayVotes, setDayVotes] = useState({});
  const [myDays, setMyDays] = useState([]);
  const [loading, setLoading] = useState(true);
  const cat = CATEGORY.find((c) => c.id === destination.category);

  const load = useCallback(async () => {
    setLoading(true);
    const dv = await fetchTerminDayVotes(roomCode, termin.id);
    setDayVotes(dv);
    setMyDays(dv[name] || []);
    setLoading(false);
  }, [roomCode, termin.id, name]);

  useEffect(() => { load(); }, [load]);

  const saveMyDays = async (days) => {
    setMyDays(days);
    await dbSet(roomCode, `termintage:${termin.id}:${name}`, days);
    setDayVotes((prev) => ({ ...prev, [name]: days }));
  };
  const toggleDay = (day) => {
    const next = myDays.includes(day) ? myDays.filter((d) => d !== day) : [...myDays, day];
    saveMyDays(next);
  };

  const dayCounts = useMemo(() => {
    const arr = termin.candidateDays.map((day) => ({
      day,
      count: Object.values(dayVotes).filter((list) => (list || []).includes(day)).length,
    }));
    arr.sort((a, b) => b.count - a.count);
    let rank = 0, last = null;
    return arr.map((d, i) => { if (d.count !== last) { rank = i + 1; last = d.count; } return { ...d, rank }; });
  }, [termin.candidateDays, dayVotes]);
  const maxCount = Math.max(...dayCounts.map((d) => d.count), 1);

  const votedMembers = members.filter((m) => dayVotes[m] && dayVotes[m].length > 0);
  const pendingMembers = members.filter((m) => !votedMembers.includes(m));

  return (
    <div style={S.tabContent}>
      <button style={S.backBtn} onClick={onBack}>← Zurück zu allen Terminen</button>

      <div style={S.roundHeaderCard}>
        <div style={S.roundCardTop}>
          <span style={S.roundAliasBig}>{destination.name}</span>
          <span style={{ ...S.statusBadge, background: STATUS_COLOR[status] + "22", color: STATUS_COLOR[status] }}>{STATUS_LABEL[status]}</span>
        </div>
        <div style={S.tagRow}>
          {cat && <span style={{ ...S.tag, background: cat.color + "22", color: cat.color }}>{cat.emoji} {cat.label}</span>}
        </div>
        <div style={S.roundDates}>Offen bis {formatDate(termin.endDate)}</div>
      </div>

      {loading && <div style={S.voteHint}>Lädt Stimmen …</div>}

      {!loading && status === "aktiv" && (
        <>
          <div style={S.sectionLabel}>An welchem Tag kannst du?</div>
          <div style={S.voteHint}>Wähl alle Tage aus, an denen es bei dir passt – jederzeit änderbar.</div>
          {termin.candidateDays.map((day) => (
            <label key={day} style={S.checkRow}>
              <input type="checkbox" checked={myDays.includes(day)} onChange={() => toggleDay(day)} />
              <span>{formatDate(day)}</span>
            </label>
          ))}
          {pendingMembers.length > 0 && <div style={S.pendingBanner}>Noch offen: {pendingMembers.join(", ")}</div>}
          <div style={S.sectionLabel}>Terminstand</div>
          {dayCounts.map((dc) => (
            <div key={dc.day} style={S.rankRow}>
              <div style={S.rankBadge}>{dc.rank}</div>
              <div style={{ flex: 1 }}>
                <div style={S.rankName}>{formatDate(dc.day)}</div>
                <div style={S.rankBarTrack}><div style={{ ...S.rankBarFill, width: `${Math.max(6, (dc.count / maxCount) * 100)}%` }} /></div>
              </div>
              <div style={S.rankPoints}>{dc.count}</div>
            </div>
          ))}
          <button style={S.dangerBtn} onClick={onDelete}>Terminfindung löschen</button>
        </>
      )}

      {!loading && status === "beendet" && (
        <>
          <div style={S.sectionLabel}>Ergebnis</div>
          {dayCounts.map((dc) => (
            <div key={dc.day} style={S.rankRow}>
              <div style={S.rankBadge}>{dc.rank}</div>
              <div style={{ flex: 1 }}><div style={S.rankName}>{formatDate(dc.day)}</div></div>
              <div style={S.rankPoints}>{dc.count}</div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function ArchivTab({ destinations, onReactivate }) {
  if (destinations.length === 0) {
    return (
      <div style={S.tabContent}>
        <div style={S.emptyState}><span style={{ fontSize: 26 }}>🗂️</span><p>Noch nichts archiviert. Ziele, bei denen ihr wart, landen hier – mit der Punktzahl aus der letzten beendeten Runde, falls vorhanden.</p></div>
      </div>
    );
  }
  const sorted = [...destinations].sort((a, b) => new Date(b.archivedAt) - new Date(a.archivedAt));
  return (
    <div style={S.tabContent}>
      {sorted.map((d) => {
        const cat = CATEGORY.find((c) => c.id === d.category);
        return (
          <div key={d.id} style={{ ...S.card, opacity: 0.85 }}>
            <ImageWithFallback src={d.photoUrl} alt={d.name} style={S.cardImg} />
            <div style={S.cardBody}>
              <div style={S.cardTitle}>{d.name}</div>
              <div style={S.tagRow}>
                {cat && <span style={{ ...S.tag, background: cat.color + "22", color: cat.color }}>{cat.emoji} {cat.label}</span>}
              </div>
              <div style={S.archiveInfo}>
                Archiviert am {formatDate(d.archivedAt ? d.archivedAt.slice(0, 10) : "")}
                {d.archivedPoints !== null && d.archivedPoints !== undefined ? ` · ${d.archivedPoints} Punkte` : " · kein Rundenergebnis"}
              </div>
              <div style={S.cardFooter}>
                <span style={S.proposedBy}>Vorschlag von {d.proposedBy}</span>
                <button style={S.visitedBtn} onClick={() => onReactivate(d.id)}>↺ Wieder einbringen</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}
