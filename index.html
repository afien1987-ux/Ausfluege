<script type="text/plain" id="app-source">
const { useState, useEffect, useCallback, useMemo } = React;

if (!window.supabase) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;font-family:sans-serif;color:#8a2e2e;background:#fbeaea;min-height:100vh;">' +
    '<h3>Supabase-Bibliothek nicht geladen</h3>' +
    '<p>Bitte Internetverbindung pr&uuml;fen und Seite neu laden.</p></div>';
  throw new Error("supabase-js nicht geladen");
}

const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const TABLE = "pool_data";

async function dbGet(roomCode, key) {
  const { data, error } = await sb.from(TABLE).select("data_value").eq("room_code", roomCode).eq("data_key", key).maybeSingle();
  if (error) { console.error(error); return null; }
  return data ? data.data_value : null;
}
async function dbSet(roomCode, key, value) {
  const { error } = await sb.from(TABLE).upsert(
    { room_code: roomCode, data_key: key, data_value: value, updated_at: new Date().toISOString() },
    { onConflict: "room_code,data_key" }
  );
  if (error) console.error(error);
}
async function dbListKeys(roomCode, prefix) {
  const { data, error } = await sb.from(TABLE).select("data_key").eq("room_code", roomCode).like("data_key", `${prefix}%`);
  if (error) { console.error(error); return []; }
  return data.map((d) => d.data_key);
}
async function fetchRoundVotes(roomCode, roundId) {
  const prefix = `votes:${roundId}:`;
  const keys = await dbListKeys(roomCode, prefix);
  const votesObj = {};
  for (const k of keys) {
    const v = await dbGet(roomCode, k);
    if (v) votesObj[k.slice(prefix.length)] = v;
  }
  return votesObj;
}

const CATEGORY = [
  { id: "draussen", label: "Draußen", emoji: "🌲", color: "#3F6B4A" },
  { id: "drinnen", label: "Drinnen", emoji: "🏛️", color: "#4C7A94" },
];
const DURATION = [
  { id: "kurz", label: "Kurz (< 2 Std.)" },
  { id: "halbtag", label: "Halbtag" },
  { id: "ganztag", label: "Ganztag" },
];
const COST = [
  { id: "kostenlos", label: "Kostenlos" },
  { id: "guenstig", label: "Günstig" },
  { id: "teuer", label: "Teurer" },
];
const uid = () => Math.random().toString(36).slice(2, 10);
const REFRESH_MS = 6000;

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function formatDate(dateStr) {
  if (!dateStr) return "";
  try {
    const [y, m, d] = dateStr.split("-");
    return `${d}.${m}.${y}`;
  } catch (e) {
    return dateStr;
  }
}
function roundStatus(round) {
  const t = todayStr();
  if (t < round.startDate) return "geplant";
  if (t > round.endDate) return "beendet";
  return "aktiv";
}
const STATUS_LABEL = { geplant: "Geplant", aktiv: "Aktiv", beendet: "Beendet" };
const STATUS_COLOR = { geplant: "#8A8A7A", aktiv: "#3F6B4A", beendet: "#4C7A94" };

function App() {
  const [loadingProfile, setLoadingProfile] = useState(true);
  const [roomCode, setRoomCode] = useState("");
  const [name, setName] = useState("");
  const [joined, setJoined] = useState(false);
  const [tab, setTab] = useState("ziele");
  const [destinations, setDestinations] = useState([]);
  const [members, setMembers] = useState([]);
  const [rounds, setRounds] = useState([]);
  const [busy, setBusy] = useState(false);
  const [recentProfiles, setRecentProfiles] = useState([]);

  useEffect(() => {
    try {
      const recentRaw = localStorage.getItem("ausflug_recent");
      if (recentRaw) setRecentProfiles(JSON.parse(recentRaw) || []);
    } catch (e) {}
    try {
      const raw = localStorage.getItem("ausflug_profile");
      if (raw) {
        const p = JSON.parse(raw);
        if (p.roomCode && p.name) {
          setRoomCode(p.roomCode);
          setName(p.name);
          setJoined(true);
        }
      }
    } catch (e) {}
    setLoadingProfile(false);
  }, []);

  const rememberProfile = (rc, n) => {
    localStorage.setItem("ausflug_profile", JSON.stringify({ roomCode: rc, name: n }));
    setRecentProfiles((prev) => {
      const filtered = prev.filter((p) => !(p.roomCode === rc && p.name === n));
      const next = [{ roomCode: rc, name: n }, ...filtered].slice(0, 6);
      localStorage.setItem("ausflug_recent", JSON.stringify(next));
      return next;
    });
  };

  const destKey = "destinations";
  const membersKey = "members";
  const roundsKey = "rounds";

  const ensureMembership = useCallback(async (roomCode, name) => {
    const raw = await dbGet(roomCode, membersKey);
    const list = raw || [];
    if (!list.includes(name)) {
      const next = [...list, name];
      await dbSet(roomCode, membersKey, next);
      return next;
    }
    return list;
  }, []);

  const refresh = useCallback(async () => {
    if (!roomCode) return;
    setBusy(true);
    const destRaw = await dbGet(roomCode, destKey);
    setDestinations(destRaw || []);
    const membersRaw = await dbGet(roomCode, membersKey);
    setMembers(membersRaw || []);
    const roundsRaw = await dbGet(roomCode, roundsKey);
    setRounds(roundsRaw || []);
    setBusy(false);
  }, [roomCode]);

  useEffect(() => {
    if (!joined) return;
    (async () => {
      await ensureMembership(roomCode, name);
      await refresh();
    })();
    const interval = setInterval(refresh, REFRESH_MS);
    return () => clearInterval(interval);
  }, [joined, refresh]);

  const handleJoin = () => {
    if (!roomCode.trim() || !name.trim()) return;
    const rc = roomCode.trim().toUpperCase();
    const n = name.trim();
    setRoomCode(rc);
    setName(n);
    rememberProfile(rc, n);
    setJoined(true);
  };
  const quickJoin = (profile) => {
    setRoomCode(profile.roomCode);
    setName(profile.name);
    rememberProfile(profile.roomCode, profile.name);
    setJoined(true);
  };
  const switchPool = () => setJoined(false);

  const saveDestinations = async (next) => {
    setDestinations(next);
    await dbSet(roomCode, destKey, next);
  };
  const addDestination = async (dest) => {
    const next = [...destinations, { ...dest, id: uid(), archived: false, archivedAt: null, archivedPoints: null, proposedBy: name }];
    await saveDestinations(next);
  };
  const removeDestination = async (id) => {
    const next = destinations.filter((d) => d.id !== id);
    await saveDestinations(next);
  };

  const activeDestinations = destinations.filter((d) => !d.archived);
  const archivedDestinations = destinations.filter((d) => d.archived);

  const archiveDestination = async (id) => {
    const candidateRounds = rounds
      .filter((r) => r.destinationIds.includes(id) && roundStatus(r) === "beendet")
      .sort((a, b) => (a.endDate < b.endDate ? 1 : -1));
    let pts = null;
    if (candidateRounds.length > 0) {
      const votes = await fetchRoundVotes(roomCode, candidateRounds[0].id);
      let sum = 0;
      Object.values(votes).forEach((v) => { if (v && v[id] !== undefined) sum += Number(v[id]) || 0; });
      pts = sum;
    }
    const next = destinations.map((d) =>
      d.id === id ? { ...d, archived: true, archivedAt: new Date().toISOString(), archivedPoints: pts } : d
    );
    await saveDestinations(next);
  };
  const reactivateDestination = async (id) => {
    const next = destinations.map((d) =>
      d.id === id ? { ...d, archived: false, archivedAt: null, archivedPoints: null } : d
    );
    await saveDestinations(next);
  };

  const saveRounds = async (next) => {
    setRounds(next);
    await dbSet(roomCode, roundsKey, next);
  };
  const createRound = async (roundData) => {
    const next = [...rounds, { ...roundData, id: uid(), createdBy: name, createdAt: new Date().toISOString() }];
    await saveRounds(next);
  };
  const deleteRound = async (id) => {
    const next = rounds.filter((r) => r.id !== id);
    await saveRounds(next);
  };

  if (loadingProfile) return <div style={S.loadingScreen}>Lädt …</div>;
  if (!joined) return <JoinScreen roomCode={roomCode} setRoomCode={setRoomCode} name={name} setName={setName} onJoin={handleJoin} recentProfiles={recentProfiles} onQuickJoin={quickJoin} />;

  return (
    <div style={S.app}>
      <Header roomCode={roomCode} name={name} onRefresh={refresh} onSwitchPool={switchPool} busy={busy} />
      <div style={S.content}>
        {tab === "ziele" && (
          <ZieleTab destinations={activeDestinations} onAdd={addDestination} onRemove={removeDestination} onArchive={archiveDestination} />
        )}
        {tab === "runden" && (
          <RundenTab
            rounds={rounds}
            destinations={destinations}
            activeDestinations={activeDestinations}
            members={members}
            roomCode={roomCode}
            name={name}
            onCreateRound={createRound}
            onDeleteRound={deleteRound}
          />
        )}
        {tab === "archiv" && (
          <ArchivTab destinations={archivedDestinations} onReactivate={reactivateDestination} />
        )}
        {tab === "hilfe" && <HilfeTab />}
      </div>
      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
}

function JoinScreen({ roomCode, setRoomCode, name, setName, onJoin, recentProfiles, onQuickJoin }) {
  const [showHelp, setShowHelp] = useState(false);

  if (showHelp) {
    return (
      <div style={S.joinWrap}>
        <div style={{ ...S.joinCard, maxHeight: "85vh", overflowY: "auto" }}>
          <button style={S.backBtn} onClick={() => setShowHelp(false)}>← Zurück zum Beitreten</button>
          <HilfeTab />
        </div>
      </div>
    );
  }

  return (
    <div style={S.joinWrap}>
      <div style={S.joinCard}>
        <div style={S.joinIcon}>🧭</div>
        <h1 style={S.joinTitle}>Ausflugs-Pool</h1>
        <p style={S.joinSub}>Sammelt Ziele, vergebt Punkte, findet eure gemeinsame Prioritätenliste.</p>
        <button style={S.helpLink} onClick={() => setShowHelp(true)}>❓ Wie funktioniert die App?</button>

        {recentProfiles && recentProfiles.length > 0 && (
          <div style={{ marginBottom: 18 }}>
            <label style={S.label}>Zuletzt genutzt</label>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {recentProfiles.map((p, i) => (
                <button key={i} style={S.recentBtn} onClick={() => onQuickJoin(p)}>
                  <span style={{ fontWeight: 700 }}>{p.roomCode}</span>
                  <span style={{ color: "#8A8A7A" }}> · {p.name}</span>
                  <span style={{ marginLeft: "auto" }}>→</span>
                </button>
              ))}
            </div>
            <div style={S.orDivider}>oder neu / anders beitreten</div>
          </div>
        )}

        <label style={S.label}>Familien-Code</label>
        <input style={S.input} placeholder="z. B. MEYER26" value={roomCode} onChange={(e) => setRoomCode(e.target.value.toUpperCase())} maxLength={20} />
        <p style={S.hint}>Jeder in der Familie gibt denselben Code ein – so landen alle Stimmen im selben Pool.</p>
        <label style={S.label}>Dein Name</label>
        <input style={S.input} placeholder="z. B. Papa, Lina, Oma..." value={name} onChange={(e) => setName(e.target.value)} maxLength={24} />
        <button style={{ ...S.primaryBtn, opacity: roomCode.trim() && name.trim() ? 1 : 0.45 }} disabled={!(roomCode.trim() && name.trim())} onClick={onJoin}>
          Beitreten →
        </button>
      </div>
    </div>
  );
}

function Header({ roomCode, name, onRefresh, onSwitchPool, busy }) {
  return (
    <div style={S.header}>
      <div>
        <div style={S.headerEyebrow}>FAMILIEN-CODE</div>
        <div style={S.headerName2}>{roomCode}</div>
      </div>
      <div style={S.headerRight}>
        <div style={S.headerName}>{name}</div>
        <button style={S.iconBtn} onClick={onSwitchPool} title="Pool wechseln"><span>🔀</span></button>
        <button style={S.iconBtn} onClick={onRefresh} title="Aktualisieren">
          <span className={busy ? "spin" : ""} style={{ display: "inline-block" }}>↻</span>
        </button>
      </div>
    </div>
  );
}

function TabBar({ tab, setTab }) {
  const items = [
    { id: "ziele", label: "Ziele", emoji: "📍" },
    { id: "runden", label: "Runden", emoji: "🗳️" },
    { id: "archiv", label: "Archiv", emoji: "🗂️" },
    { id: "hilfe", label: "Hilfe", emoji: "❓" },
  ];
  return (
    <div style={S.tabBar}>
      {items.map(({ id, label, emoji }) => (
        <button key={id} onClick={() => setTab(id)} style={{ ...S.tabBtn, color: tab === id ? "#3F6B4A" : "#8A8A7A" }}>
          <span style={{ fontSize: 18 }}>{emoji}</span>
          <span style={{ fontWeight: tab === id ? 700 : 500 }}>{label}</span>
        </button>
      ))}
    </div>
  );
}

function ZieleTab({ destinations, onAdd, onRemove, onArchive }) {
  const [showForm, setShowForm] = useState(false);
  return (
    <div style={S.tabContent}>
      {!showForm && <button style={S.addBtn} onClick={() => setShowForm(true)}>+ Neues Ziel vorschlagen</button>}
      {showForm && <AddForm onCancel={() => setShowForm(false)} onSubmit={(d) => { onAdd(d); setShowForm(false); }} />}
      {destinations.length === 0 && !showForm && (
        <div style={S.emptyState}><span style={{ fontSize: 26 }}>📍</span><p>Noch keine Ziele im Pool. Schlag das erste vor!</p></div>
      )}
      {destinations.map((d) => <DestCard key={d.id} d={d} onRemove={onRemove} onArchive={onArchive} />)}
    </div>
  );
}

function DestCard({ d, onRemove, onArchive }) {
  const cat = CATEGORY.find((c) => c.id === d.category);
  return (
    <div style={S.card}>
      {d.photoUrl && <img src={d.photoUrl} alt={d.name} style={S.cardImg} />}
      <div style={S.cardBody}>
        <div style={S.cardTopRow}>
          <div style={S.cardTitle}>{d.name}</div>
          <button style={S.closeBtn} onClick={() => onRemove(d.id)}>✕</button>
        </div>
        {d.desc && <div style={S.cardDesc}>{d.desc}</div>}
        <div style={S.tagRow}>
          {cat && <span style={{ ...S.tag, background: cat.color + "22", color: cat.color }}>{cat.emoji} {cat.label}</span>}
          {d.duration && <span style={S.tag}>⏱ {DURATION.find((x) => x.id === d.duration)?.label}</span>}
          {d.cost && <span style={S.tag}>💰 {COST.find((x) => x.id === d.cost)?.label}</span>}
        </div>
        <div style={S.cardFooter}>
          <span style={S.proposedBy}>Vorschlag von {d.proposedBy}</span>
          <button style={S.visitedBtn} onClick={() => onArchive(d.id)}>✓ Waren dort</button>
        </div>
      </div>
    </div>
  );
}

function AddForm({ onSubmit, onCancel }) {
  const [name, setName] = useState("");
  const [desc, setDesc] = useState("");
  const [category, setCategory] = useState("draussen");
  const [duration, setDuration] = useState("halbtag");
  const [cost, setCost] = useState("guenstig");
  const [photoUrl, setPhotoUrl] = useState("");
  return (
    <div style={S.formCard}>
      <input style={S.input} placeholder="Name des Ziels" value={name} onChange={(e) => setName(e.target.value)} />
      <textarea style={{ ...S.input, minHeight: 56, resize: "vertical" }} placeholder="Kurze Beschreibung (optional)" value={desc} onChange={(e) => setDesc(e.target.value)} />
      <input style={S.input} placeholder="Foto-URL (optional)" value={photoUrl} onChange={(e) => setPhotoUrl(e.target.value)} />
      <div style={S.formRow}>{CATEGORY.map((c) => <Chip key={c.id} active={category === c.id} onClick={() => setCategory(c.id)}>{c.label}</Chip>)}</div>
      <div style={S.formRow}>{DURATION.map((d) => <Chip key={d.id} active={duration === d.id} onClick={() => setDuration(d.id)}>{d.label}</Chip>)}</div>
      <div style={S.formRow}>{COST.map((c) => <Chip key={c.id} active={cost === c.id} onClick={() => setCost(c.id)}>{c.label}</Chip>)}</div>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <button style={S.secondaryBtn} onClick={onCancel}>Abbrechen</button>
        <button style={{ ...S.primaryBtn, flex: 1, opacity: name.trim() ? 1 : 0.45 }} disabled={!name.trim()}
          onClick={() => onSubmit({ name: name.trim(), desc: desc.trim(), category, duration, cost, photoUrl: photoUrl.trim() })}>
          Hinzufügen
        </button>
      </div>
    </div>
  );
}

function Chip({ active, onClick, children }) {
  return <button onClick={onClick} style={{ ...S.chip, background: active ? "#3F6B4A" : "#EFEDE3", color: active ? "#F7F4EC" : "#4A4A3E" }}>{children}</button>;
}

function RundenTab({ rounds, destinations, activeDestinations, members, roomCode, name, onCreateRound, onDeleteRound }) {
  const [mode, setMode] = useState("list"); // list | create | detail
  const [selectedId, setSelectedId] = useState(null);

  if (mode === "create") {
    return (
      <RoundCreateForm
        activeDestinations={activeDestinations}
        existingCount={rounds.length}
        onCancel={() => setMode("list")}
        onSubmit={(data) => { onCreateRound(data); setMode("list"); }}
      />
    );
  }

  if (mode === "detail" && selectedId) {
    const round = rounds.find((r) => r.id === selectedId);
    if (!round) { setMode("list"); return null; }
    return (
      <RoundDetail
        round={round}
        destinations={destinations}
        members={members}
        roomCode={roomCode}
        name={name}
        onBack={() => { setMode("list"); setSelectedId(null); }}
        onDelete={() => { onDeleteRound(round.id); setMode("list"); setSelectedId(null); }}
      />
    );
  }

  const sorted = [...rounds].sort((a, b) => (a.startDate < b.startDate ? 1 : -1));

  return (
    <div style={S.tabContent}>
      <button style={S.addBtn} onClick={() => setMode("create")}>+ Neue Runde erstellen</button>
      {sorted.length === 0 && (
        <div style={S.emptyState}><span style={{ fontSize: 26 }}>🗳️</span><p>Noch keine Runde erstellt. Legt eine an, um mit Start-/Enddatum abzustimmen.</p></div>
      )}
      {sorted.map((r) => {
        const status = roundStatus(r);
        return (
          <button key={r.id} style={S.roundCard} onClick={() => { setSelectedId(r.id); setMode("detail"); }}>
            <div style={S.roundCardTop}>
              <span style={S.roundAlias}>{r.alias}</span>
              <span style={{ ...S.statusBadge, background: STATUS_COLOR[status] + "22", color: STATUS_COLOR[status] }}>{STATUS_LABEL[status]}</span>
            </div>
            <div style={S.roundDates}>{formatDate(r.startDate)} – {formatDate(r.endDate)} · {r.destinationIds.length} Ziele</div>
          </button>
        );
      })}
    </div>
  );
}

function RoundCreateForm({ activeDestinations, existingCount, onSubmit, onCancel }) {
  const [alias, setAlias] = useState(`Runde ${existingCount + 1}`);
  const [startDate, setStartDate] = useState(todayStr());
  const [endDate, setEndDate] = useState(todayStr());
  const [selectedIds, setSelectedIds] = useState([]);

  const toggle = (id) => {
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const valid = alias.trim() && startDate && endDate && endDate >= startDate && selectedIds.length >= 2;

  return (
    <div style={S.formCard}>
      <label style={S.label}>Alias / Name der Runde</label>
      <input style={S.input} value={alias} onChange={(e) => setAlias(e.target.value)} placeholder="z. B. Sommerferien 2026" />

      <label style={S.label}>Startet am</label>
      <input style={S.input} type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} />

      <label style={S.label}>Offen bis</label>
      <input style={S.input} type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} />
      {endDate < startDate && <p style={{ ...S.hint, color: "#8a2e2e" }}>Enddatum liegt vor dem Startdatum.</p>}

      <label style={S.label}>Ziele in dieser Runde ({selectedIds.length} ausgewählt)</label>
      {activeDestinations.length === 0 && <p style={S.hint}>Noch keine Ziele im Pool – erst im Tab "Ziele" welche anlegen.</p>}
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
        {activeDestinations.map((d) => (
          <label key={d.id} style={S.checkRow}>
            <input type="checkbox" checked={selectedIds.includes(d.id)} onChange={() => toggle(d.id)} />
            <span>{d.name}</span>
          </label>
        ))}
      </div>
      {activeDestinations.length > 0 && selectedIds.length < 2 && <p style={S.hint}>Mindestens 2 Ziele auswählen.</p>}

      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <button style={S.secondaryBtn} onClick={onCancel}>Abbrechen</button>
        <button
          style={{ ...S.primaryBtn, flex: 1, opacity: valid ? 1 : 0.45 }}
          disabled={!valid}
          onClick={() => onSubmit({ alias: alias.trim(), startDate, endDate, destinationIds: selectedIds })}
        >
          Runde erstellen
        </button>
      </div>
    </div>
  );
}

function RoundDetail({ round, destinations, members, roomCode, name, onBack, onDelete }) {
  const status = roundStatus(round);
  const roundDests = destinations.filter((d) => round.destinationIds.includes(d.id));
  const [votes, setVotes] = useState({});
  const [myDraft, setMyDraft] = useState({});
  const [loadingVotes, setLoadingVotes] = useState(status !== "geplant");

  const loadVotes = useCallback(async () => {
    if (status === "geplant") return;
    setLoadingVotes(true);
    const v = await fetchRoundVotes(roomCode, round.id);
    setVotes(v);
    setMyDraft(v[name] || {});
    setLoadingVotes(false);
  }, [roomCode, round.id, name, status]);

  useEffect(() => { loadVotes(); }, [loadVotes]);

  const saveMyVotes = async (draft) => {
    setMyDraft(draft);
    await dbSet(roomCode, `votes:${round.id}:${name}`, draft);
    setVotes((prev) => ({ ...prev, [name]: draft }));
  };

  const ranking = useMemo(() => {
    const sums = {};
    roundDests.forEach((d) => (sums[d.id] = 0));
    Object.values(votes).forEach((v) => {
      Object.entries(v || {}).forEach(([destId, pts]) => {
        if (sums[destId] !== undefined) sums[destId] += Number(pts) || 0;
      });
    });
    const arr = roundDests.map((d) => ({ ...d, points: sums[d.id] || 0 }));
    arr.sort((a, b) => b.points - a.points);
    let rank = 0, lastPoints = null;
    return arr.map((d, i) => {
      if (d.points !== lastPoints) { rank = i + 1; lastPoints = d.points; }
      return { ...d, rank };
    });
  }, [roundDests, votes]);

  const completedVoters = members.filter((m) => votes[m] && Object.keys(votes[m]).length === roundDests.length);
  const pendingVoters = members.filter((m) => !completedVoters.includes(m));

  return (
    <div style={S.tabContent}>
      <button style={S.backBtn} onClick={onBack}>← Zurück zu allen Runden</button>

      <div style={S.roundHeaderCard}>
        <div style={S.roundCardTop}>
          <span style={S.roundAliasBig}>{round.alias}</span>
          <span style={{ ...S.statusBadge, background: STATUS_COLOR[status] + "22", color: STATUS_COLOR[status] }}>{STATUS_LABEL[status]}</span>
        </div>
        <div style={S.roundDates}>{formatDate(round.startDate)} – {formatDate(round.endDate)}</div>
      </div>

      {status === "geplant" && (
        <>
          <div style={S.voteHint}>Diese Runde startet am {formatDate(round.startDate)}. Bis dahin ist noch keine Abstimmung möglich.</div>
          <div style={S.sectionLabel}>Vorschau: {roundDests.length} Ziele</div>
          {roundDests.map((d) => <div key={d.id} style={S.previewRow}>{d.name}</div>)}
          <button style={S.dangerBtn} onClick={onDelete}>Runde löschen</button>
        </>
      )}

      {status !== "geplant" && loadingVotes && <div style={S.voteHint}>Lädt Stimmen …</div>}

      {status === "aktiv" && !loadingVotes && (
        <>
          <VotingBlock destinations={roundDests} myVotes={myDraft} onSave={saveMyVotes} />
          <div style={S.sectionLabel}>Zwischenstand (live)</div>
          {pendingVoters.length > 0 && <div style={S.pendingBanner}>Noch offen: {pendingVoters.join(", ")}</div>}
          <RankingList ranking={ranking} />
        </>
      )}

      {status === "beendet" && !loadingVotes && (
        <>
          <div style={S.sectionLabel}>Ergebnis</div>
          <RankingList ranking={ranking} />
        </>
      )}
    </div>
  );
}

function VotingBlock({ destinations, myVotes, onSave }) {
  const n = destinations.length;
  const [draft, setDraft] = useState({});
  useEffect(() => { setDraft(myVotes || {}); }, [myVotes, destinations.length]);

  const usedPoints = new Set(Object.values(draft).filter((v) => v !== undefined && v !== ""));
  const allNumbers = Array.from({ length: n }, (_, i) => i + 1);
  const completed = Object.keys(draft).length === n && new Set(Object.values(draft)).size === n;

  const setPoint = (destId, val) => {
    const next = { ...draft };
    if (val === "") delete next[destId]; else next[destId] = Number(val);
    setDraft(next);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={S.voteHint}>Vergib Punkte von 1 bis {n} — dein wichtigstes Ziel bekommt {n}, jede Zahl nur einmal.</div>
      {destinations.map((d) => {
        const current = draft[d.id] ?? "";
        return (
          <div key={d.id} style={S.voteRow}>
            <div style={S.voteName}>{d.name}</div>
            <select style={{ ...S.select, borderColor: current ? "#3F6B4A" : "#D8D5C6" }} value={current} onChange={(e) => setPoint(d.id, e.target.value)}>
              <option value="">–</option>
              {allNumbers.map((num) => <option key={num} value={num} disabled={usedPoints.has(num) && current !== num}>{num}</option>)}
            </select>
          </div>
        );
      })}
      <button style={{ ...S.primaryBtn, opacity: completed ? 1 : 0.45 }} disabled={!completed} onClick={() => onSave(draft)}>
        {completed ? "Bewertung speichern" : `Noch ${n - Object.keys(draft).length} Ziel(e) offen`}
      </button>
    </div>
  );
}

function RankingList({ ranking }) {
  if (ranking.length === 0) return <div style={S.emptyState}><p>Noch keine Stimmen abgegeben.</p></div>;
  const maxPoints = Math.max(...ranking.map((r) => r.points), 1);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {ranking.map((d) => (
        <div key={d.id} style={S.rankRow}>
          <div style={S.rankBadge}>{d.rank}</div>
          <div style={{ flex: 1 }}>
            <div style={S.rankName}>{d.name}</div>
            <div style={S.rankBarTrack}><div style={{ ...S.rankBarFill, width: `${Math.max(6, (d.points / maxPoints) * 100)}%` }} /></div>
          </div>
          <div style={S.rankPoints}>{d.points}</div>
        </div>
      ))}
    </div>
  );
}

function ArchivTab({ destinations, onReactivate }) {
  if (destinations.length === 0) {
    return (
      <div style={S.tabContent}>
        <div style={S.emptyState}><span style={{ fontSize: 26 }}>🗂️</span><p>Noch nichts archiviert. Ziele, bei denen ihr wart, landen hier – mit der Punktzahl aus der letzten beendeten Runde, falls vorhanden.</p></div>
      </div>
    );
  }
  const sorted = [...destinations].sort((a, b) => new Date(b.archivedAt) - new Date(a.archivedAt));
  return (
    <div style={S.tabContent}>
      {sorted.map((d) => {
        const cat = CATEGORY.find((c) => c.id === d.category);
        return (
          <div key={d.id} style={{ ...S.card, opacity: 0.85 }}>
            {d.photoUrl && <img src={d.photoUrl} alt={d.name} style={S.cardImg} />}
            <div style={S.cardBody}>
              <div style={S.cardTitle}>{d.name}</div>
              <div style={S.tagRow}>
                {cat && <span style={{ ...S.tag, background: cat.color + "22", color: cat.color }}>{cat.emoji} {cat.label}</span>}
              </div>
              <div style={S.archiveInfo}>
                Archiviert am {formatDate(d.archivedAt ? d.archivedAt.slice(0, 10) : "")}
                {d.archivedPoints !== null && d.archivedPoints !== undefined ? ` · ${d.archivedPoints} Punkte` : " · kein Rundenergebnis"}
              </div>
              <div style={S.cardFooter}>
                <span style={S.proposedBy}>Vorschlag von {d.proposedBy}</span>
                <button style={S.visitedBtn} onClick={() => onReactivate(d.id)}>↺ Wieder einbringen</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}
